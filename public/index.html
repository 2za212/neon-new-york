<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202933"><link rel="icon" href="data:,"><title>赛博都市 · 霓虹夜景</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#202933;color:#edf0f2;font:13px "Microsoft YaHei",system-ui,sans-serif}canvas{display:block;touch-action:none;outline:0}
header{position:fixed;left:clamp(18px,3vw,42px);top:clamp(18px,4vh,38px);pointer-events:none;z-index:2}
h1{font-weight:500;font-size:clamp(23px,3vw,34px);letter-spacing:.18em;margin:0 0 8px;text-shadow:0 2px 9px #15202b88}header p{margin:0;color:#c0c8cf;font-size:12px;letter-spacing:.08em}
nav{position:fixed;left:clamp(15px,3vw,42px);bottom:26px;display:flex;align-items:center;gap:3px;padding:4px;background:#1c2731ed;border:1px solid #93a2ae45;border-radius:5px;z-index:3}
button{font:inherit;cursor:pointer;background:transparent;color:#d1d9df;border:0;border-radius:3px;padding:10px 15px}
button:hover{background:#ffffff13}button[aria-pressed=true]{background:#e5e9ec;color:#1f2c38}
#info{position:fixed;right:clamp(16px,3vw,42px);bottom:29px;text-align:right;line-height:1.8;color:#aebac4;font-size:11px;pointer-events:none}#where{color:#e5eaee}
#guide{position:fixed;right:clamp(16px,3vw,42px);top:clamp(22px,4vh,42px);font-size:12px;color:#c3cbd1;letter-spacing:.03em;text-align:right;line-height:1.9;pointer-events:none}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#202933;z-index:6;font-size:15px;letter-spacing:.1em}
#move{display:none;position:fixed;left:18px;bottom:92px;width:100px;height:100px;touch-action:none;border:1px solid #ccd3d74d;border-radius:50%;background:#26374677;z-index:3}#knob{position:absolute;left:33px;top:33px;width:34px;height:34px;border-radius:50%;background:#dbe1e8aa;pointer-events:none}
#vertical{position:fixed;right:15px;bottom:95px;display:none;gap:5px;z-index:3}#vertical button{background:#263746bb;border:1px solid #a8b4bf66;touch-action:none}
.photo #lighting,.photo header,.photo nav,.photo #info,.photo #guide,.photo #move,.photo #vertical{display:none!important}
#ambient-control{position:fixed;right:clamp(16px,3vw,42px);top:132px;display:flex;gap:8px;align-items:center;color:#c3cbd1;font-size:11px;z-index:3;background:#142332c9;padding:8px 10px;border:1px solid #8e9eac35;border-radius:3px}
#ambient{width:88px;accent-color:#69d0d9;cursor:pointer}.photo #ambient-control{display:none!important}
#wall-style{position:fixed;right:clamp(16px,3vw,42px);top:180px;z-index:3;background:#142332df;border:1px solid #8e9eac35;font-size:11px;padding:8px 11px;color:#d5e0ea}.photo #wall-style{display:none!important}
@media(max-width:680px){nav{display:grid!important;grid-template-columns:repeat(3,1fr);gap:2px}#info{bottom:112px!important}#move,#vertical{bottom:145px!important}}
@media(pointer:coarse){body.roaming #move{display:block}body.roaming #vertical{display:flex}#guide{font-size:11px;max-width:160px}}
@media(max-width:680px){header{top:18px;left:18px}header p{font-size:10px}#guide{top:85px;left:18px;right:auto;text-align:left;font-size:11px}nav{bottom:16px;left:12px;right:12px;justify-content:space-between}button{font-size:12px;padding:9px 10px}#info{bottom:72px;right:16px;font-size:10px}}
</style></head><body>
<header><h1>赛博都市</h1><p>细体素都市 · 霓虹夜景</p></header>
<button id="lighting" style="position:fixed;right:clamp(16px,3vw,42px);top:85px;background:#1c2731dc;z-index:3;border:1px solid #8e9eac55">切换日景</button><div id="guide">拖动旋转 · 滚轮缩放 · 右键平移</div>
<label id="ambient-control">环境亮度 <input id="ambient" aria-label="环境亮度" type="range" min="0.65" max="1.6" step="0.05" value="1"></label>
<button id="wall-style" aria-pressed="true">像素墙面：开</button>
<nav aria-label="选择视角"><button data-view="overview" aria-pressed="true">整体模型</button><button data-view="street" aria-pressed="false">地面街道</button><button data-view="detail" aria-pressed="false">墙面近景</button><button data-view="rail" aria-pressed="false">高架步道</button><button data-view="air" aria-pressed="false">空中漫游</button><button data-view="top" aria-pressed="false">俯视</button></nav>
<div id="info"><span id="where">整体模型</span><br>WASD 漫游 · H 隐藏界面</div>
<div id="move"><div id="knob"></div></div><div id="vertical"><button data-key="e" aria-label="上升">升</button><button data-key="q" aria-label="下降">降</button></div>
<div id="load">正在载入精细体素模型…</div>
<script src="scene.js?v=wall-pixels2"></script></body></html>
